  - id: OPEN-CONFLICT-008
    topic: Vendor原生包Image_Type与Code_Size语义
    question: 是否保持Vendor原生Image_Type 0/1/2/3和Bootloader代码不变，由NGU release工具/adapter在提交前及eHSM PASS后强制Code_Size等于package_size减1024，并由受信typed-stage registry区分FMC/GSP/PMP/RMP/MMP？
    status: resolved
    evidence_state: CONFIRMED
    owner: 项目负责人
    conflict_report: sources/conflict-reports/CONFLICT-VENDOR-NATIVE-PACKAGE-SEMANTICS.md
    evidence: evidence/code-investigations/CE-SEC-009-secure-package-verify-loader-contract.md
    resolution_date: 2026-07-23
    resolution: 项目负责人批准ADR-0014的Vendor wire和双阶段长度合同；ADR-0030替代其中Manifest方案，ADR-0033进一步冻结Header CRC。Vendor wire保留Image_Type=0/1/2/3且公共代码不变；FMC/GSP/PMP/RMP/MMP及Die1固定type 1，type 2/3拒绝，type 0只用于eHSM FW。项目身份来自受信typed-stage registry；type 1 Header offset1008为LE64 load_addr、offset1016为覆盖Header 256到1015的LE32 CRC-32/ISO-HDLC、offset1020为零reserved[4]。release工具/adapter在提交前及PASS后强制Code_Size等于package_size减1024并重算Header CRC；失败禁止loader、Measurement和release。旧Manifest及旧8字节零reserved包无兼容路径。
  - id: OPEN-CONFLICT-009
    topic: Vendor版本计数器提交机制与FMC/GSP release顺序
    question: FMC如何在release GSP前主动提交16字节SoC rollback_counter，而不依赖GSP后续加载eHSM FW或映射Host通用Counter？
    status: resolved
    evidence_state: CONFIRMED
    owner: 项目负责人
    conflict_report: sources/conflict-reports/CONFLICT-VENDOR-VERSION-COUNTER-COMMIT-SEQUENCE.md
    evidence:
      - evidence/code-investigations/CE-SEC-011-vendor-version-counter-contract.md
      - decisions/ADR-0019-rollback-counter-manifest-version-and-no-host-gsp-service.md
    resolution_date: 2026-07-28
    resolution: eHSM BL新增专用16字节SoC staged-candidate commit API。BootROM固定以check_version=0验证Vendor type 1 FMC，BL暂存认证candidate；FMC初始化把FMC Measurement中的expected candidate再次传给BL。BL必须先逐字节匹配RAM candidate，无candidate/失效/不一致时在OTP改动前拒绝；一致后低值拒绝、相等不写、高值单向写并权威readback。proof成立后才接收以check_version=0验证且counter等于已提交值的GSP。不得使用ehsm_read_counter(uint64_t)、raw OTP、GSP值或FW启动副作用替代。准确command ID/packing/LCS权限属于实施冻结项。
  - id: OPEN-CONFLICT-010
    topic: BootROM secure_boot Strap位号与软件寄存器映射
    question: SRC-0023截图把boot_pin.secure_boot标为bit[3]，而SRC-0022的MGMT/SEC STRAP_PIN生成头均把SEC_BOOT定义为bit0、bit3定义为DIE_ID；两者是否是顶层pin向量到软件寄存器的重排，BootROM应读取哪个寄存器镜像和位？
    status: blocked_by_rtl_sync
    evidence_state: CONFLICTING
    owner: 项目负责人；SoC/RTL/BootROM启动Owner
    conflict_report: sources/conflict-reports/CONFLICT-BOOTROM-SECURE-BOOT-STRAP-BIT-AND-POLICY.md
    evidence:
      - evidence/code-investigations/CE-SEC-012-bootrom-secure-mode-strap-checklist.md
      - sources/source-cards/SRC-0023.md
      - sources/source-cards/SRC-0022.md
    resolution_date: 2026-07-29
    resolution: 项目负责人指定以SRC-0023截图为本项Strap产品权威，固定boot_pin.secure_boot[3]、default 0、0为非安全启动、1为安全启动；在non_sec_boot=0时USER忽略Strap强制安全。SRC-0034/ADR-0031新增的non_sec_boot=1最高优先级覆盖由OPEN-DESIGN-024另行绑定。当前SRC-0022生成头把bit0命名为SEC_BOOT、bit3命名为DIE_ID，与Strap合同冲突。Strap策略不再开放，但BootROM真实寄存器绑定和EMU确定性Expected必须等待RTL/生成头修正，或等待经批准的顶层pin到软件字段映射及对应命名宏；不得直接使用当前bit0、当前bit3或私有裸位号。
    decision: decisions/ADR-0018-bootrom-strap-lifecycle-and-lcs-timing.md
  - id: OPEN-CONFLICT-011
    topic: SRC-0015 SoC Key轮换目标与当前Vendor代码交付差距
    question: 哪个Vendor定制Host/BL/FW交付和release note实现SRC-0015的专用轮换命令、HSM Bitmap、USER授权、旧Key destroy和掉电恢复？
    status: blocked_by_vendor_delivery
    evidence_state: CONFIRMED
    owner: Vendor接口Owner；eHSM交付Owner；GSP Key/Provisioning Owner
    conflict_report: sources/conflict-reports/CONFLICT-SRC-0015-CURRENT-VENDOR-KEY-ROTATION.md
    evidence:
      - evidence/code-investigations/CE-SEC-013-soc-key-rotation-delivery-gap.md
      - decisions/ADR-0021-soc-key-rotation-vendor-mechanism.md
      - sources/source-cards/SRC-0015.md
    resolution_date: 2026-07-28
    resolution: Key Rotation以云天定制需求作为目标设计，后续Vendor Host/BL/FW按主详设第10章更新。当前产品实现和EMU标记BLOCKED_BY_VENDOR_DELIVERY，直到匹配的定制TRM、Host API、BL/FW和release note交付；禁止用当前通用INSTALL_RANDOM_KEY/INSTALL_ENCRYPT_KEY模拟轮换。本项不阻断详设评审。
  - id: OPEN-CONFLICT-012
    topic: 一机一密RTL Key目标与Vendor共享宏集成方式
    question: 量产RTL Root/Install KEK按die唯一后，NGU800P采用何种隐藏个性化载体、Secure ATE接口、CPU/Debug/Scan不可读控制、lock和operation proof，而不是在共享netlist中固化同一Vendor RTL宏常量？
    status: target_accepted_implementation_binding_pending
    evidence_state: CONFLICTING
    owner: RTL/DFT Owner；eHSM集成Owner；KMS/制造Owner
    conflict_report: sources/conflict-reports/CONFLICT-PER-DIE-RTL-KEY-VS-VENDOR-SHARED-MACRO.md
    evidence:
      - decisions/ADR-0025-device-unique-rtl-key-and-16-slot-otp-baseline.md
      - docs/05-software-design/NGU800P安全软件详细设计.md
      - sources/source-cards/SRC-0017.md
      - sources/source-cards/SRC-0018.md
      - sources/source-cards/SRC-0035.md
      - decisions/ADR-0032-ehsm-vendor-rtl-authority-and-query-rules.md
    resolution_date: 2026-07-29
    resolution: 产品目标已批准为一机一密，至少RTL Root、Install KEK eHSM/SoC及启用的Scan授权秘密按die唯一且软件不可读。SRC-0035已确认当前源码候选路径使用共享字面量宏，但缺正式elaboration和逐die载体，不能作为量产完成证据。Vendor宏只能表达集成接口，不能作为量产共享值。实现可采用hidden OTP/eFuse、PUF/Helper Data、Key Ladder或等价机制，但必须由RTL/DFT/制造提供逐die注入/派生、lock、negative-read和operation proof；到齐前量产实现状态为BLOCKED_BY_RTL_BINDING，Key字面量禁止复制或外发。
