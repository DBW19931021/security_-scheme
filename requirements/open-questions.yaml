    resolution: 负责人批准ADR-0022最终逻辑ABI：128B Header、实际数量的128B紧凑Firmware Entry、唯一128B SoC State，total_len=256+fw_entry_count×128；BootROM作为隐式可信测量根且不建普通Entry；删除state_entry_count、generation、eHSM状态、Measurement地址domain、key_id/signer_id和时间戳；每结构只保留一个reserved，保留CRC-32C和32位commit。Firmware以fw_type+die_id+instance_id唯一；ADR-0030确认包内不携带measurement_slot或身份，Entry身份由stage producer按受信topology元组生成。State提交后Table最终完成。ADR-0028又固定物理Region为16 KiB、理论最多126个Firmware Entry；产品实际实例数、PMA/cache/Firewall和SPDM wire block由独立输入管理。
    implementation_boundaries: 逻辑ABI和16 KiB物理Region已关闭；最大独立Firmware/微核实例数只用于冻结产品实际max_fw_entries且必须不超过126。PMA/cache和Firewall继续由OPEN-CONFLICT-006管理，对齐32位store跨master可见性必须在编码前用平台Evidence证明；SPDM wire由OPEN-DESIGN-015管理。
