    topic: Measurement Table最终ABI与Commit
    question: BootROM→FMC rollback_counter producer/consumer及门禁已冻结；Measurement Table最终magic/version/C layout、可变entry、integrity、commit原子宽度、reset清理和SPDM快照如何实现？
