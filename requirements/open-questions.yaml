    owner: 项目负责人
    conflict_report: sources/conflict-reports/CONFLICT-MEASUREMENT-ADDRESS-WIDTH-OWNERSHIP.md
    resolution_date: 2026-07-22
    resolution: Measurement中的load_addr和entry_addr均保留为uint64_t System Address且不携带domain；二者只记录loader成功执行后的审计快照，不能反向驱动load/jump。ADR-0030固定Header Overlay只存load_addr，typed-stage loader保持执行地址唯一Owner，entry_addr=load_addr，见ADR-0005/0022/0030。
