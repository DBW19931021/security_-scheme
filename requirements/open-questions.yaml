    resolution: 项目负责人批准三套产品Secure Package算法Profile：SHA-256+RSA-2048+AES-128-CBC、SHA-256+ECDSA/secp256r1+AES-128-CBC、SM3+SM2+SM4-CBC。RSA按Vendor原生RSASSA-PSS/SHA-256绑定，ECC为raw 64字节P-256签名，SM2按Vendor SM3/Z值/raw 64字节格式，CBC固定16字节IV和无padding；Profile ID为1/2/3。所有产品构建保留三条路径，三套均须通过完整启动链、更新链和负向测试，不允许SKU裁剪。其他Vendor算法只进入baremetal能力/回归测试，产品Package/policy/release拒绝。
  - id: OPEN-DESIGN-005
