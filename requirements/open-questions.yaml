    question: 是否取消独立SEC_RAM_EHSM_MAILBOX物理Region，改为BootROM/FMC/GSP各自固定EHSM_CONTEXT_ARENA；每stage的channel/context并发数、slot大小、cache属性、对齐及timeout/late-response回收规则是什么？
