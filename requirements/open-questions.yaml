    resolution_date: 2026-07-22
    resolution: 2026-07-28最终裁决废止早期地址转换方案；ADR-0030进一步删除Manifest并固定Header offset1008为LE64 load_addr、entry_addr等于load_addr。C908、Header Overlay、loader、linker和eHSM descriptor全部直接使用baremetal MANAGEMENT_NOC_S9_SRAM_BASE/SIZE定义的System Address，不建立Local/System映射；local/remap输入和旧0x1010_0808_0000拒绝。
  - id: OPEN-CONFLICT-004
    topic: Measurement地址字段宽度与职责
    question: Measurement load_addr/entry_addr的宽度、domain和相对Header Overlay/loader的职责是什么？
