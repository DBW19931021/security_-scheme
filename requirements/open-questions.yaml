  - id: OPEN-CONFLICT-006
    topic: 2 MiB安全RAM Region、PMA与Firewall输入
    question: C908和全部产品软件已统一使用baremetal System Address，2 MiB精确Region offset/size已由SRC-0031/ADR-0028冻结；当前还需冻结PMA属性、Firewall窗口参数、MMP DDR Profile及release link map峰值Evidence。
    status: open
    evidence_state: CONFLICTING
    owner: 项目负责人
    conflict_report: sources/conflict-reports/CONFLICT-SECURITY-RAM-TARGET-AND-CURRENT-LINKERS.md
    partial_resolution_date: 2026-08-19
    partial_resolution: 新2 MiB目标正式替代旧080x，产品软件唯一使用MANAGEMENT_NOC_S9_SRAM_BASE=0x1010_0500_0000、SIZE=0x200000的System Address。SRC-0031/ADR-0028冻结精确布局：GSP静态880 KiB、FMC启动复用128 KiB、Measurement 16 KiB、PMP 256 KiB、RMP 256 KiB、Host ingress 512 KiB；MMP主要驻留DDR。独立plaintext Region取消，FMC/GSP/PMP/RMP采用Host ingress分离、尚未运行目标Region受控原地加载；FMC退出后其128 KiB经撤权、清零和回读才可加入GSP动态池，Measurement不被复用。eHSM可访问整个2 MiB，独立Mailbox Region继续采用stage-local固定EHSM_CONTEXT_ARENA。PMA属性、Firewall绑定、MMP DDR carveout/release及release link map峰值Evidence仍待输入。
    evidence:
      - evidence/code-investigations/CE-SEC-004-security-ram-map-and-mailbox.md
      - evidence/code-investigations/CE-SEC-010-ngu800p-ehsm-mmio-memory-view-pma.md
      - decisions/ADR-0028-security-sram-fixed-layout-and-in-place-loader.md
    recommendation: 直接实现ADR-0028的固定offset/size和受控原地加载；由平台Owner补齐PMA/Firewall/MMP DDR Profile，由各Runtime Owner提供release link map、data/BSS/stack/heap峰值证明。未取得这些Evidence前不发布最终linker或MMP地址。
  - id: OPEN-CONFLICT-007
    topic: NGU800P通用Mailbox与Vendor eHSM Mailbox绑定
    question: NGU800P采用Vendor direct 16×4 KiB Mailbox合同还是把4 KiB SECURITY_SUBSYS_MAILBOX作为协议wrapper？
    status: resolved
    evidence_state: CONFIRMED
    owner: 项目负责人
    conflict_report: sources/conflict-reports/CONFLICT-NGU800P-GENERIC-VS-EHSM-MAILBOX-MMIO.md
    evidence: evidence/code-investigations/CE-SEC-007-ngu800p-ehsm-port-binding.md
    resolution_date: 2026-07-23
    resolution: eHSM交互固定follow Vendor direct实现并见ADR-0010，Vendor公共代码原则上不可修改；采用16 channel、每channel 0x1000 stride的direct Mailbox合同，4 KiB/84-message SECURITY_SUBSYS_MAILBOX不用于eHSM wrapper。NGU800P通过custom header、port函数、外部构建和项目adapter移植；direct aperture/status准确宏须同步进入SRC-0022，缺失时阻断真实MMIO，但不重开transport方向。
