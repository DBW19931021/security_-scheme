    - 实施时可复用现有 runner/build 机制和任务锁定的 FSP/OSR Host 通用业务代码，但不得复用 stub 行为、历史 Expected 或未经验证的平台地址/timer/reset 实现；可执行测试从最新有效测试工作簿派生。
