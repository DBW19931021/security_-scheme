    - 测试执行必须记录芯片/RTL/BootROM/FMC/GSP/eHSM/Host版本、载体、配置、命令、日志哈希和 Evidence 路径；Vendor 回归不能替代 SoC 级发布 Evidence。
    - 修改 security_-scheme 正式详设或测试规划前读取本仓库 AGENTS.md、相关 Source/ADR/OpenSpec；修改软件实现前再读取 gsp-pmp-rmp-omp/AGENTS.md 和 components/security/docs/openspec/development_principles.md；修改可执行测试/runner/tools 前再读取 baremetal/AGENTS.md 和 components/ngu_security/docs/openspec/development_principles.md。
    - 代码调查和代码修改是两个不同阶段：INV-SEC任务只能读取目标仓库并写CE-SEC报告；只有Feature通过详设门禁且实施任务获批准后才能修改代码。
