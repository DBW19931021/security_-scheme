schema: spec-driven

context: |
  本项目是 NGU800 SoC 安全工程工作空间。security_-scheme 仓库是安全需求、架构、决策、OpenSpec、正式软件详设、全部项目任务、测试策略/计划/工作簿、开发追溯、验证 Evidence 和问题知识的唯一事实源；source-vault/vendor_rtl（SRC-0035）是eHSM内部硬件实现细节、RTL实现基线和问题查询的第一受控输入；../gsp-pmp-rmp-omp 是 BootROM/FMC/GSP 产品安全软件实现仓库；../baremetal（用户口头称 baremental）是运行在安全核上的独立 baremetal 软件栈，负责 eHSM 全接口/全算法能力测试、EMU runner 和测试工具，不由 GSP 固件 task/service 承载；../fsp 是该测试工作线当前的独立、持续更新 eHSM Vendor/FSP 代码与 Demo 只读工作参考。
  本项目只保留两个顶层交付任务：TASK-SEC-BAREMETAL-EHSM-001负责baremetal中的eHSM全接口/全能力测试；TASK-SEC-SOC-FW-001负责Wing-M130/eHSM BL集成以及C908 BootROM/FMC/GSP正式详设和产品实现。既有TASK-SEC-DD/DEV-PLAN/EMU-PREP、INV-SEC、DEV-SEC和TST-SEC均为这两个顶层任务的从属工作包或追溯记录，不作为额外顶层任务。
  所有新增 Markdown 默认使用中文。命令、路径、寄存器名、协议字段、代码标识符和第三方接口名称可以保留英文。
  开始任何变更前，读取 AGENTS.md、PROJECT_STATUS.md、manifests/repositories.yaml、sources/source-index.yaml、相关 Source Card、需求、设计、ADR 和 open questions。
  硬件及安全结论只能使用 CONFIRMED、DOCUMENTED、VENDOR_IMPLEMENTATION、ASSUMPTION、PROPOSED、DEPRECATED、OBSOLETE 或 CONFLICTING。不得把 Datasheet、Vendor 代码、讨论记录或既有方案自动描述为已确认硬件事实。
  每项硬件相关结论必须记录 Source ID、适用芯片/版本、事实状态、章节或页码、验证状态和待确认问题。Vendor 代码只能作为 VENDOR_IMPLEMENTATION 证据。
  代码快照中夹带的历史 review、自动分析报告和旧 OpenSpec 只能证明曾存在相关分析。具体发现必须以 ASSUMPTION 开始，重新核对代码版本、Vendor 文档和独立 Evidence 后，才能进入正式 issue、需求、设计、ADR 或当前 OpenSpec change。
  方案权威顺序为：SRC-0017 芯片系统安全方案提供系统级硬件基础、架构和原则，SRC-0016 芯片安全软件方案在其约束下提供软件工程落地和最终采用的软件方案。软件实现不得违背 SRC-0017，也不得把未写入 SRC-0016 或其后续有效版本的 Vendor 建议当作已批准项目方案。
  SRC-0024是项目负责人提供并确认目标为security_-scheme的OTP Table 34和16-slot Key表；它修正ADR-0025/0026早期转录。baremetal中的slot manifest、fixture和case binding只派生同一方案表，不存在“baremetal当前基准”与方案基准并列。Table 34、物理Key ID、Level、截图Key类型及slot8/13/14权限已冻结；slot2类型、具体算法、Key Attribute/CRC/ECC/backend和材料仍待实施输入。
  本项目中的 Vendor 仅指 eHSM 及 eHSM 内部 Core，不包含 NGU800P SoC。Vendor 资料和实现不得直接定义 SoC 行为。密钥轮换策略以云天定制需求为当前目标；三类SoC Key、每类一次、HSM 1字节Bitmap、48字节双层封装、一次性USER operation鉴权、写Key→Bitmap→destroy→reset机制已纳入软件方案，当前实现状态为BLOCKED_BY_VENDOR_DELIVERY，通用安装接口不得模拟。ADR-0025进一步冻结量产RTL Root/Install KEK按die唯一、软件不可读和16个OTP Key对象；Vendor共享RTL宏不得作为量产Key值，KMS按设备托管句柄并生成设备专属封装。
  NGU800P SoC地址空间、寄存器base/offset/bitfield、IRQ编号/名称及同类RTL同步硬件常量，以SRC-0022登记的../baremetal/components/chip_riscv_c908_common/include/ngu800p当前有效生成头为第一权威源。gsp-pmp-rmp-omp同名头只是实现镜像，Vendor示例地址不得覆盖SRC-0022。该规则不把baremetal的test/stub/demo/Expected提升为方案，也不允许仅凭地址名推断接口Owner、wrapper语义、cache、RAS、reset或产品流程。
  eHSM/Core内禀硬件实现特性、寄存器实现、状态机、reset/default和内部连接必须先查SRC-0035/source-vault/vendor_rtl，再对照当前有效Vendor手册的接口意图和任务锁定版本FSP的软件使用行为。每项RTL结论锁定tree hash、路径、module/instance/symbol、紧凑行范围以及top/filelist/define/parameter/generate/wrapper条件；缺少实际elaboration证明时只能写候选配置并标为ASSUMPTION，同时登记缺失输入。直接RTL事实为VENDOR_IMPLEMENTATION，不自动等于CONFIRMED。TASK-SEC-BAREMETAL-EHSM-001 的新用例梳理/开发仍优先使用 ../fsp 当前代码，从 ../fsp/test_demo/demo/test.c 的 ehsm_demo_test() 展开；每次任务记录 remote/branch/commit/工作区状态。SRC-0018/source-vault/vendor-code/osr_eshm 仅保留为历史不可变快照和旧 Evidence 复核入口。除非RTL/资料缺失、无法elaborate、来源冲突、问题依赖NGU800P SoC集成参数/产品策略、需要动态验证，或新Vendor交付替代当前资料，不得把现有资料已经回答的内容重复列为open question。SRC-0035不定义SoC地址、cache/一致性、PMA/Firewall、RAS/reset产品连接或项目软件策略；冲突仍须升级。
  source-vault/vendor_rtl按不可变只读快照管理；树哈希变化时停止沿用SRC-0035，新投递建立新Source ID和Supersedes。目录中的Key/KEK字面量不得复制到设计、日志、测试Expected、软件、KMS/MES或对外材料，不得用于量产或一机一密声明；未确认授权前按RESTRICTED_PENDING_CONFIRMATION处理并禁止外发/上传第三方服务。
  对本工程而言 Vendor 文档分类为 NOT_CONFIDENTIAL_FOR_THIS_PROJECT。Vendor 正式交付代码按快照整体登记，不逐文件建立 Source Card；后续正式版本必须依据 delivery/release note 分配新 Source ID，并关联 Supersedes。../fsp 的持续更新作为按 commit 锁定的工作参考；其结论需进入受控基线或正式 Evidence 时，再按快照规则登记。
  SRC-0016/SRC-0017 PDF 保持为受控原始基线；docs 目标目录只沉淀裁决后的可执行结论，不复制 PDF 全文。当前有效 PDF、accepted ADR/amendment 和未决冲突统一登记在 docs/09-plans/BASELINE-CONTROL.md。
  “软件方案为准”是规范目标，不得用来忽略 Vendor 文档、代码、测试或实测中的明显矛盾。发现规范冲突、目标—实现差距、文档—代码不一致、版本不匹配或 SoC/eHSM/Core/Host 边界不清时，受影响结论标为 CONFLICTING，停止受影响范围并在当前任务内提交冲突报告供用户裁决。
  原始资料放在 source-vault/，登记和分析记录放在 sources/，经评审结论放在 docs/、requirements/ 和 decisions/；OpenSpec 只引用 Source ID，不复制原始资料作为事实。
  SRC-0016 之后必须先形成可完全指导开发的详细设计。正式详设由 GSP 负责产出和评审，但统一存放在 security_-scheme：系统/架构结论进入 docs/03-architecture/，接口契约进入 docs/04-interfaces/，软件详设主入口和专题详设进入 docs/05-software-design/。详设必须包含模块/文件职责、ABI、数据结构、状态机、时序、权限、错误、并发/内存、reset/掉电、日志/清零、测试钩子和 requirement-to-code map；gsp-pmp-rmp-omp 只保留实现代码和实现所必需的就地说明，不新增项目正式详设或任务计划副本。
  测试原始输入按 Source ID 不可变保存在 source-vault/internal-specs/test-inputs/；当前及后续版本化测试工作簿、测试策略、测试计划、case 规划和追踪统一保存在 security_-scheme 的 tests/ 和 docs/06-verification/，每次更新生成新文件，不覆盖旧版本。可执行测试代码和必要测试数据放在 ../baremetal/components/security/，不在那里维护第二份项目测试规划、工作簿或SoC方案基线。工作簿中黄色表示修改、绿色表示新增、橙色表示待确认或冲突阻塞；实际执行结果和发布签核保存在 evidence/，用例文件本身不等同于 Evidence。
  现有 gsp-pmp-rmp-omp/baremetal test、stub、demo、synthetic package/measurement 和历史 Expected 只表示当前代码事实与差距，不是目标设计、最终 test oracle、验收或发布依据。EMU/产品实现禁止 stub、simulated success、test key/cert/provider、未批准 hardcode 和 silent fallback；未完成能力必须不可达、禁用或 fail-close。BootROM/FMC/GSP 可复用当前 FSP/OSR Host 通用业务代码，但必须隔离 NGU800P port 并完成项目 ABI、错误和安全门禁适配，Vendor 平台地址/timer/reset magic 不直接复用。
  DD-02按两条路径管理：baremetal以case list完整覆盖每项任务锁定的 ../fsp/test_demo ehsm_demo_test() BL/FW/可选功能，command拼装无特殊差异时可复用，顶层case注册/runner/结果follow baremetal；SRC-0018 只用于历史覆盖差异和旧 Evidence 复核。gsp-pmp-rmp-omp第一阶段主要以当前 FSP bl_demo能力为输入，只复用合适的底层函数和command格式，payload、任务串联、安全启动和SPDM调用以芯片安全软件方案及批准详设为准。Vendor Demo顶层顺序和最终打印不是产品流程或发布oracle；两个目标仓库分别创建实施任务。
  ADR-0004/0024/0030及负责人最终裁决规定：内部Measurement Table独立记录Die1实例（NGU_FW_TYPE_DIE1_FW、die_id=1）；Native Header offset1008只携带LE64 load_addr且不带domain，entry_addr固定等于load_addr；C908、Header Overlay、loader、linker和eHSM共享descriptor全部直接使用baremetal MANAGEMENT_NOC_S9_SRAM_BASE/SIZE System Address，不建立Local/System映射。当前不采用版本化Handoff，不得生成相应ABI/SRAM/commit协议或编码任务。ADR-0004中的旧GSP绝对地址0x1010_0808_0000不得继续作为新D0目标地址。
  OPEN-CONFLICT-004已关闭并由ADR-0022/0030更新：Measurement中的load_addr和entry_addr均保留为uint64_t System Address且不携带domain，只作loader成功执行后的只读审计快照，不能反向作为load/jump输入；Header Overlay/typed-stage loader保持执行地址唯一Owner，entry_addr=load_addr。
  ADR-0019已关闭OPEN-CONFLICT-005：Vendor手册和代码的SoC Version_Counter均为16字节，旧冲突只来自SRC-0016的32位uint32_t示例，不存在32字节歧义。项目唯一使用rollback_counter[16]，禁止32/64位截断、第二套项目Counter或__int128布局依赖。
  CE-SEC-011已确认当前Vendor实现的16字节Version Counter采用从首octet开始推进的thermometer/unary位模式；eHSM BL对SoC非naked镜像成功验证后只把候选值和valid标记暂存到eHSM DRAM，不写OTP，且check_version=OFF也不禁止该暂存；真正OTP写入及回读校验由eHSM Vendor FW的secboot_entry在启动时完成。当前匹配Host声明的64位通用Counter命令在匹配FW快照中没有命令注册、dispatch和service/driver实现，不能替代16字节Version Counter。
  ADR-0019已关闭OPEN-CONFLICT-009：BootROM固定以check_version=0验证Vendor type 1 FMC，由BL暂存认证candidate；eHSM BL必须新增FMC初始化可调用的专用16字节staged-candidate commit API。FMC从有效FMC Measurement取得expected candidate并回传，BL必须先与RAM candidate逐字节exact-match，再执行stored比较、低值拒绝、相等不写、高值单向写和权威readback。proof成立后FMC才接收以check_version=0验证且counter等于已提交值的GSP。不得使用ehsm_read_counter(uint64_t)、raw OTP、GSP值或eHSM FW启动副作用替代。准确command ID、packing、LCS权限和交付版本是实施DoR。
  Wing-M130/eHSM BL默认保持Vendor业务基线；项目只冻结配套版本、配置、自检/ready/error、Mailbox和升级边界并完成NGU800P集成。只有经Evidence确认的配置/接口缺口、版本不配套、安全缺陷或Vendor正式变更才创建单独BL变更任务。
  ADR-0006～0008及ADR-0028规定：安全RAM产品System Address基址为0x1010_0500_0000、总容量2 MiB，新布局替代BootROM/FMC/GSP旧080x地址；0x1000_0500_0000 local/remap值只保留为RTL事实，产品软件拒绝且不定义映射。精确布局固定为GSP静态880 KiB、FMC启动复用128 KiB、Measurement 16 KiB、PMP 256 KiB、RMP 256 KiB和Host ingress 512 KiB；MMP主要驻留DDR，不占本2 MiB常驻Region。独立plaintext Region取消，Host ingress与eHSM output必须分离，FMC/GSP/PMP/RMP只允许向尚未运行且RW/NX的最终目标Region受控原地加载。FMC退出后其128 KiB经撤权、清零和回读后才可加入GSP动态池；Measurement未使用空间也不得被GSP复用。SPDM/MCTP/证书处理等计入GSP。eHSM作为受信任master可以访问整个2 MiB，不设置Region级Firewall限制，但adapter仍检查command System Address/长度/active descriptor/生命周期/PMA/barrier。Host不得直接访问目标明文、Measurement或执行区。独立Mailbox物理Region已取消；packet/cmd/rsp/context放入BootROM/FMC/GSP各自固定EHSM_CONTEXT_ARENA。首版禁止异步和流式API，只使用one-shot typed API且不分配ehsm_session_st；timeout未闭环context不得放在普通函数栈上。
  ADR-0006规定：NGU800P Mailbox的command/response、packet及note/interrupt机制follow Vendor eHSM；NGU800P只实现port适配，不另造协议。BootROM/FMC/GSP和production eHSM adapter只记录、阻断release并上报错误；reset/watchdog/隔离动作由RAS策略决定和执行，Vendor reset函数不得用于production普通timeout/retry。
  OPEN-CONFLICT-006已按ADR-0028进一步部分裁决：新2 MiB目标、唯一System Address及精确Region offset/size均已冻结；MMP改为DDR常驻，独立plaintext Region取消，采用受控原地加载；eHSM可访问整个2 MiB，独立Mailbox Region继续采用stage-local EHSM_CONTEXT_ARENA。ADR-0016确认GSP替代旧OMP/Q&P产品固件。剩余PMA属性、Firewall参数、MMP DDR carveout/release以及各镜像release link map/栈堆峰值Evidence关闭前，不得发布最终linker、MMP地址或精确Expected；旧P1样例和旧linker均不得作为编码常量。
  ADR-0009已收敛SoC数值源：SRC-0022给出2 MiB RAM的local/remap 0x1000_0500_0000、NoC/system 0x1010_0500_0000及容量，并给出SECURITY_SUBSYS_MAILBOX为0x1000/0x1010_0841_0000、4 KiB、84-message布局。CE-SEC-010进一步确认eHSM IRQ1～16依次编码为APLIC domain 9、source 78～93，即0x0009_004E～0x0009_005D；首版poll不依赖IRQ与Vendor channel的映射，未来interrupt change必须先取得逐channel权威映射并验证。
  ADR-0010已关闭OPEN-CONFLICT-007方向选择：eHSM交互采用Vendor direct 16×4 KiB Mailbox合同，Vendor公共源码不修改，4 KiB通用Mailbox不用于eHSM wrapper。NGU800P只通过项目custom header、port函数、外部build和adapter集成；CE-SEC-010确认当前SRC-0022仍没有direct aperture及Host status/error的准确base/offset/bitfield，缺失时阻断真实MMIO且不得使用4 KiB块或OSR样例地址代替。BootROM/FMC/GSP首版全程固定poll；Vendor FW ready后的interrupt仅作为后续独立优化，必须重新通过设计变更和完整切换门禁。RAS未ready时保存静态错误记录、有限deadline重试上报，超时后关闭普通中断并进入无限WFI fail-stop循环，仅允许平台批准的Reset/NMI退出，不自行reset或继续启动。
  ADR-0011已冻结首版Host adapter：BootROM/FMC/GSP各一个64字节对齐、256字节静态context slot且每stage最多一条在途，GSP所有task经唯一service串行化。Vendor公共poll只有send前无参数cache钩子，adapter在调用前安装唯一active cache/timeout scope并保证在途no-touch；首版所有eHSM operation自动retry为0，timeout统一标记acceptance unknown并quarantine整个service/slot，迟到响应未闭环前不得复用。Context arena采用NON_CACHEABLE还是HARDWARE_COHERENT延期到SoC稳定后裁决；裁决前禁止选择默认属性，最终无法保证Vendor内部rsp可见性时升级兼容性问题，不得修改Vendor公共代码。
  Context arena与Measurement/共享区在NON_CACHEABLE和HARDWARE_COHERENT两个候选下均不得执行data clean/invalidate，只保留write/release和acquire/read barrier；CACHED_WITH_MAINTENANCE配置必须被production初始化拒绝。首版只使用one-shot typed API，不注册init/update/finish且session容量为0。
  Registry/profile生成组织固定为components/security/config下security_abi_registry.yaml、security_product_profiles.yaml、security_provisioning_release_matrix.yaml、security_ram_layout.yaml四个项目权威源，由统一生成器输出C header、linker include、制包/测试schema和security_abi_registry.json审计快照；不使用巨型配置、不复制SRC-0022/Vendor权威常量、不生成密钥。
  CE-SEC-010确认当前C908初始化无条件启用I/D cache，BootROM/FMC及当前GSP未发现启用S-mode MMU/PBMT，也未发现该2 MiB RAM的物理PMA/coherence或可独立non-cacheable映射证据；不得把CONFIG_XUANTIE_SVPBMT、PMP或通用IOPMP驱动的存在解释为PMA/Firewall已配置。平台未提供PMA、Firewall实例/窗口/粒度/master/default/lock/reset证据前，真实shared context、最终P1分区和Firewall编码均不具备DoR。
  Counter合同规定：BootROM success必须检查bootloader_done=1且bootloader_err=0，并保留既有hw done/error门禁；LCS由BootROM从权威SoC接口直接读取。BootROM固定以check_version=0验证Vendor type 1 FMC并使BL暂存认证candidate，不独立读/比/写stored counter。FMC初始化回传FMC Measurement expected candidate，BL逐字节exact-match后执行低值拒绝、相等不写、更高单向写和readback；proof成立后GSP及后续SoC stage包全部以Vendor type 1、check_version=0验证并等于已提交SoC值，type 2/3拒绝。eHSM FW使用独立Vendor type 0 counter域。FMC不加载Vendor FW，由GSP负责加载并等待firmware_done且无error；eHSM BL阶段全程poll。
  SRC-0034/ADR-0031在BootROM模式矩阵前增加最高优先级non_sec_boot eFuse覆盖：字段为1 bit、逻辑默认0；复位锁存快照可靠值1时包括USER在内均强制进入RESTRICTED_NONSECURE，值0时才继续SRC-0023矩阵；读取/ECC/镜像/来源异常阻断安全和非安全FMC release。ADR-0034进一步规定BootROM仍只有SECURE_BOOT/NON_SECURE_BOOT两个顶层模式：值0、DEV/MANU、boot_pin.secure_boot[3]=0且制造Profile有效时，非安全路径选择MANUFACTURING_PROVISIONING；值1、LCS异常和其他非制造组合选择RESTRICTED_NONSECURE，两个子Profile不得fallback。BootROM只消费专用只读逻辑快照，不开放raw eFuse或Key安装；准确word/bit/编码、ECC/valid/镜像、只读视图、DEV/MANU烧写/锁定Owner和USER独立维修入口由OPEN-DESIGN-024管理，缺失时BLOCKED_BY_NON_SEC_BOOT_BINDING。SRC-0023是负责人提供的BootROM高优先级Checklist输入：secureboot.001～007必须逐项落实到第6章状态机、接口、错误和测试追溯。值0时产品Strap合同为boot_pin.secure_boot[3]、default 0、0非安全/1安全，USER忽略Strap强制安全启动。当前SRC-0022生成头bit0 SEC_BOOT/bit3 DIE_ID与之冲突，真实寄存器绑定和EMU Expected必须等待RTL/生成头或权威映射同步。ADR-0024规定值0时LCS读取失败、非法、UNDEFINED、来源无法证明或策略组合未批准进入RESTRICTED_NONSECURE，且不创建Measurement Entry/SoC State或启动审计。SoC LCS不依赖eHSM Autoload。eHSM依据自身eFuse自主决定并执行自检，BootROM不得发起自检，只读取ready/error/raw状态；安全模式仍必须经过真实FMC验签解密、rollback、Header Overlay/typed-stage policy、Measurement和受控load/release，禁止stub和绕过。
  ADR-0013/0019规定：GSP产品镜像固定包含eHSM Vendor FW、PMP、RMP、MMP并分别维护状态/Measurement/release；签名、随机数、Hash及安全软件方案Feature需要的其他eHSM能力必须进入产品operation清单。通用算法只向受信任内部SoC模块开放且优先级低；不向Host开放GSP通用算法、Key、Certificate、Rotation、raw eHSM或其他安全服务。独立的固件下发、SPDM、受控Debug/OOB协议不构成GSP通用服务开放。
  Measurement Table按measurement-table.md收敛：逻辑ABI为128B Header、实际数量128B紧凑Firmware Entry和唯一128B SoC State，BootROM不建自身普通Entry，不保存generation。Firmware Entry只记录ABI字段，release_state使用RELEASE_AUTHORIZED而不是实际运行状态；失败/未验证/未获授权/隔离/非安全对象不创建成功Entry。BootROM提交FMC staged candidate；FMC初始化exact-match commit后验证等值GSP。SoC/eHSM counter域由flags区分。State提交后本boot不可变，已release Runtime/Die1 reset或隔离使SPDM NOT_READY/CONTENT_CHANGED，同boot不得重新release，恢复要求完整SoC reboot。
  ADR-0014/0030批准安全固件包与verify/loader合同：Vendor固定1024字节Header是唯一物理头，Image_Type保持0/1/2/3且Vendor公共代码不修改；FMC/GSP/PMP/RMP/MMP/Die1使用type 1，并由受信typed-stage registry区分身份。release工具/adapter必须在提交前和eHSM PASS后强制Code_Size等于package_size减1024；preflight失败不提交，PASS后复验失败禁止loader、Measurement和release。
  ADR-0030/0033规定：删除NGU Manifest、第二包头和TLV；Native Header offset1008到1015为LE64 load_addr，offset1016到1019为LE32 CRC-32/ISO-HDLC，offset1020到1023为4字节零reserved。CRC覆盖offset256到1015并在preflight和Vendor PASS后双检，只作格式完整性筛查，不替代密码认证。Code Region从1024开始且Code_Size是签名、加密、搬移和Measurement唯一长度；entry_addr固定等于load_addr。image/instance/die/consumer/Profile/key/board/LCS/policy来自受信typed-stage registry及provisioning/release matrix，rollback_counter只来自Version_Counter[16]，version只保留在外部release metadata。旧Manifest和旧8字节零reserved包无fallback或dual parser。Vendor PASS只完成密码层，必须继续完成稳定Header/Overlay/typed-stage policy、loader源摘要/copy/目标回读摘要比较、counter/Measurement和stage-owned release。
  ADR-0017/0020规定：产品Secure Package只支持三套完整Profile，ID 1为SHA-256+RSA-2048/RSASSA-PSS+AES-128-CBC，ID 2为SHA-256+ECDSA/secp256r1+AES-128-CBC，ID 3为SM3+SM2+SM4-CBC；三套全部是必实现、必测试能力，必须各自通过完整启动链和更新链，不允许SKU裁剪。其他Vendor算法只作baremetal能力/回归覆盖，产品release拒绝。所有SoC stage包固定Vendor Image_Type=1；boot/upgrade key、board/LCS绑定必须来自单一provisioning/release matrix，实际行未提供时默认拒绝。
  ADR-0015已关闭OPEN-DESIGN-009：GSP第一个、最高优先级的security_service_task从bootstrap到runtime持续作为唯一eHSM service/context Owner；完成启动门禁后同一task进入长期service loop，不发生Owner移交。其他task只能经typed queue请求，不得直接调用Vendor Host/Mailbox或取得raw handle；quarantine后只允许RAS批准的新boot instance重新初始化。OPEN-DESIGN-010等待PMP/RMP/MMP依赖/release资料，资料到齐前不得猜测加载顺序或冻结对应代码/Expected。
  Lifecycle/Debug/更新合同：BootROM失败不release且RAS不可用时进入无限WFI循环；FMC counter proof后只对确定可清理的GSP接收失败重新arm；GSP单Runtime失败局部隔离；timeout/状态未知quarantine且零自动retry。Lifecycle普通转换只允许TEST→DEV→MANU→USER→DEBUG→DESTROY相邻边，DEBUG前删除全部FW用户Key，LCS写失败进入KEYS_DELETED_LCS_UNCHANGED。Debug token无scope且SoC只有一个全局开关，一次性授权消费后关闭。运行中的eHSM FW更新只写inactive slot，reset后由BL最终验证；更新metadata固定为A/B双副本、单调sequence、integrity和commit-last。Die0作为Multi-Die安全根；security只请求RAS动作。
  SPDM首版固定证书KEY_EXCHANGE→FINISH secure session，拒绝PSK及不安全fallback；ADR-0029规定Cert0/1只存Root→Intermediate→Device Issuer三张静态前缀，GSP以FMC/GSP Measurement和slot13 UDS不导出派生一级Alias Key，运行期追加动态Firmware Alias Leaf，Alias Key签Report/SPDM transcript。软件保留P-256和SM2两套能力，每设备只启用一套Profile。Measurement不返回地址并采用summary block。transport、完整链/消息上限、block index和session wire冻结前不发布。产品/EMU禁止stub、软件CDI/private key、临时OID、自签fallback、test cert/provider、伪RNG和零签名。
  ADR-0020关闭OPEN-DESIGN-020：Feature 001至020必须形成Source到Design到Code到Case到Evidence闭环，高严重度缺陷关闭，环境缺能力标BLOCKED，waiver显式批准，流片前方案和release artifact由指定负责人签署。
  OPEN-DESIGN-014的软件设计已由ADR-0026关闭并由SRC-0024/ADR-0034细化：SoC Key轮换只覆盖Verify/Encrypt/Debug且每类一次；GSP不控制物理slot/raw Bitmap，只提交typed key_type、固定48字节密文和本operation一次性授权引用。设备在DEV完成Chip Root→Level1→目标Profile Level2、证书和最终配置产品安全启动预演，slot6/7/12轮换位置保持blank，MANU只收口，MANU→USER最后提交；每设备单Attestation Profile，UDS为slot13/Level2/asymm/七项权限，物理Key ID为0～15，Table 34和Cert0/1已冻结。制造C908是不可信caller，只能在MANUFACTURING_PROVISIONING中调用eHSM BL typed query/install/generate/proof/finalize/LCS；BL验证硬件制造条件、LCS、ticket、设备绑定、固定映射和顺序。对象状态包含PROGRAMMING_PARTIAL；仅同device/recipe/object/材料且backend支持时恢复，否则隔离。OTP/Bitmap状态未知不得自动清理、重试或回旧Key；Vendor BL制造/轮换实现BLOCKED_BY_VENDOR_DELIVERY，RTL个性化BLOCKED_BY_RTL_BINDING，Key Attribute/CRC/ECC/backend、Flash/KMS/CA/MES、wire数值及USER独立维修入口为实施绑定。
  SRC-0032/ADR-0029关闭OPEN-DESIGN-022拓扑裁决：BootROM只贡献FMC最终readback Hash，FMC只贡献GSP Hash，二者不得链接DICE/X.509栈；GSP构造固定96字节TCB Context，eHSM以slot13 UDS执行域分离KDF和确定性Alias KeyGen，UDS/CDI/Alias private均不导出；GSP固定Profile组装动态Leaf并由slot14签发。动态LeafDER不超过4096字节，GSP新增峰值不超过12 KiB，Measurement 16 KiB不得复用。准确eHSM command/Key Attribute和OID/DN/有效期/SM2编码由OPEN-DESIGN-023阻断。
  最终软件详细设计的唯一完整交付源是docs/05-software-design/NGU800P安全软件详细设计.md。架构/接口/模块专题文件用于逐章调查和评审，但不能替代完整文档；专题结论获批后必须把规范性内容合入主文档。主文档应尽量保持SRC-0016原有原则、目标、角色和信任边界，只增加工程细节；任何可能改变原方案原则的内容必须标记为PROPOSED或CONFLICTING并提交负责人裁决。开放项必须在受影响章节原位标注并在统一附录汇总，不得因未关闭而省略整个设计域。
  工程文档按ADR-0023执行可视化和双向链接：三个及以上步骤、分支、参与者、状态或内存对象的关系优先增加Mermaid流程图、时序图、状态图、数据流图或内存示意图；图示不得替代精确字段/表格/错误语义。仓库内引用必须使用可辨识的文档名称、类型/用途和可点击相对链接，不得只写裸文件名、裸Source ID或裸ADR编号；主详设与专题/ADR/Source/Evidence之间必须建立反向链接，并在修改后检查本地链接。
  当前gsp-pmp-rmp-omp和baremetal的旧Manifest/stub/packager只属代码骨架：production必须删除Manifest parser和兼容路径；32位counter、64/72字节私有头、stub成功和零签名/未加密拼包均不得进入EMU/产品或定义ABI。发布包必须使用批准的真实签名/加密工具链并生成Header Overlay。
  FW-C-001至FW-C-012是任务二的设计检查表和接口边界，不代表一次性批准12个具体ABI。Codex应逐项从Source/Vendor代码形成候选设计，只将安全策略、冲突、Owner边界和不可逆行为提交负责人裁决。
  OPEN-CONFLICT-006、OPEN-DESIGN-001/010/015/019/023及OPEN-EMU-001按各自阻断范围管理；OPEN-CONFLICT-011为Vendor轮换交付缺口，OPEN-CONFLICT-012为一机一密RTL实现绑定；OPEN-CONFLICT-013、OPEN-DESIGN-014/022的软件设计已关闭。未决物理绑定、Vendor定制交付或正式发布参数不得创建发布编码任务。
  较大的设计或软件行为变化必须先形成 OpenSpec proposal/specs/design/tasks 并等待人工批准，批准前不得修改正式安全方案或软件实现。
  允许直接在多人软件仓库默认分支的工作区修改文件，不要求创建 feature/bugfix 分支。所有任务都不需要 Git 提交；Codex 不得执行 git add、git commit、git push、merge、rebase 或 tag。
  必须保护现有无关工作区修改；无法安全区分时停止修改并报告。交付物是未提交工作区 diff、RESULT、测试结果、Evidence 和剩余风险，不是 commit、MR/PR 或合并记录。

rules:
  proposal:
    - 使用中文说明背景、当前问题、目标、非目标、适用范围和审批状态。
    - 将已知事实按证据状态分组，并为硬件结论列出 Source ID、适用版本、章节或页码和验证状态。
    - 明确列出假设、候选方案、推荐方案、风险、待确认问题以及对需求、设计、软件仓库、测试和运维的影响。
    - 未获得人工批准时保持 proposed，不得把推荐方案描述为已接受方案。
    - 引用历史 review 时必须同时引用 review Source ID、代码快照 Source ID、具体文件/行号和重新验证状态；不得把 pending_revalidation 候选项描述为已确认缺陷。
    - 涉及软件安全方案时列出 SRC-0017 的上位原则、SRC-0016 当前规定以及 Vendor 输入；未进入软件方案的 Vendor 建议保持 PROPOSED。
    - 已知冲突不得被写成普通风险带过；必须关联 conflict report，列出双方证据、影响、选项、推荐和待用户裁决问题。
  specs:
    - 只描述可验证的行为契约，不写无关实现细节；使用 Requirement 和 Scenario 结构表达正常、异常、边界和安全行为。
    - 每项行为关联 Requirement ID、Source ID、适用芯片/版本和事实状态；没有可靠依据的行为保持 ASSUMPTION 或 PROPOSED。
    - eHSM内部硬件预期先依据SRC-0035实际生效的RTL逻辑生成，并锁定tree hash、top/filelist/defines/parameters/elaboration；未实例化模块、非活动分支、孤立宏和Vendor示例代码不得生成确定性预期，不确定行为必须产生open question或探索性验证项。
    - 历史 review 发现只有在完成独立复核并形成 Evidence 后才能转化为规范性 SHALL；否则只能作为背景、风险或待确认项。
    - Vendor eHSM/Core 行为与 SoC 行为必须分开描述；SoC 级 SHALL 不能只引用 Vendor Source，软件级 SHALL 必须说明其在芯片安全软件方案中的依据。
    - Source、代码或实测处于 CONFLICTING 时，不得生成确定性 SHALL；先等待用户裁决或将行为明确标为探索性验证。
    - 安全测试场景必须覆盖正向、异常、边界、生命周期、权限、掉电/复位、回滚、故障注入和敏感材料清理；测试预期按 SRC-0017→SRC-0016→批准要求/裁决派生。
    - 不得把现有 test、stub、demo 或历史 Expected 转换成规范性 SHALL；最终测试预期必须由最新有效测试工作簿、批准方案/Requirement/ADR 和目标环境 Evidence 派生。
    - eHSM能力测试必须把任务锁定 commit 下 ../fsp/test_demo 的 ehsm_demo_test() 全部功能/接口作为coverage input并逐entry展开case；SRC-0018 仅作历史差异对照。这只冻结覆盖范围，不得把Vendor Demo顶层顺序、测试常量或最终打印转换成SoC发布Expected。
  design:
    - 覆盖系统上下文、资产、信任边界、状态机、数据流、密钥流、生命周期、权限、接口、异常处理、掉电恢复、回滚、兼容性和安全分析。
    - 区分 CONFIRMED、DOCUMENTED、VENDOR_IMPLEMENTATION、ASSUMPTION 和 PROPOSED，并逐项引用 Source ID。
    - 明确软件影响、测试影响、Evidence 计划、失败停止条件、回退策略和未解决问题。
    - 涉及密码算法、OTP/eFuse、生命周期、Debug、Key Slot、Anti-rollback、Recovery 或 Attestation 的重大决策必须关联 ADR。
    - 密钥轮换设计必须引用已批准策略、ADR-0021和主详设第10章；SRC-0015中已被ADR-0021吸收的机制是受控软件方案增量，示例slot/bit及未吸收细节仍为Vendor候选输入。
    - 收敛前必须保留实际差距：若 Vendor 代码无法满足软件方案、文档与代码不一致或边界不清，创建 conflict report 并停止受影响设计，不得仅以软件方案权威性覆盖实现证据。
    - 正式软件详设由 GSP 负责，在 security_-scheme/docs/03-architecture/、docs/04-interfaces/ 和 docs/05-software-design/ 交付；主入口默认是 docs/05-software-design/NGU800P安全软件详细设计.md。其粒度必须足以让开发者不依赖聊天记录完成模块划分、公共/私有 API、结构体与字段、状态机/时序、错误与恢复、内存/并发、配置、日志/清零、测试钩子和代码落点。
    - 对包含三个及以上步骤、分支、参与者、状态或内存对象的设计，优先增加可维护的Mermaid流程图/时序图/状态图/数据流图/内存示意图；图示必须与规范表格和文字双重表达，不能以图代替字段offset、门禁条件或错误终态。
    - 每个仓库内文档引用必须使用描述性名称、文档类型/用途和可点击相对Markdown链接；被主详设引用的专题、ADR、Source Card和Evidence必须提供返回主详设的反向链接。新增或修改文档后必须执行本地链接检查。
    - 详设必须逐 Feature 关联 SRC-0016/SRC-0017、Requirement ID、gsp-pmp-rmp-omp 目标文件/符号、security_-scheme 测试工作簿 case、baremetal 可执行测试入口和尚未裁决项；未完成上述映射不得进入实现。
    - 跨阶段度量信息使用Measurement Table；Header Overlay load_addr固定为baremetal权威头定义的64位System Address且不携带domain，entry_addr固定等于load_addr，C908、loader、linker和eHSM共享descriptor直接使用同一数值，不进行Local/System换算；错误使用统一错误/日志。不得在当前baseline中引入Handoff ABI。Die1实例和固定System Address必须按ADR-0004/0030设计和测试。
    - DD-02详设必须分别给出baremetal完整eHSM能力case list与gsp产品安全链复用映射。前者说明Demo command可复用条件、baremetal顶层规则和破坏性fixture；后者说明bl_demo底层函数/格式复用、实际payload来源、启动/SPDM编排和禁止移植的Demo/platform内容。
    - 安全RAM详设必须单独成章，覆盖ADR-0028固定的完整2 MiB Region总和/重叠/alignment、启动复用视图、唯一System Address、owner和Host/eHSM/C908/RAS权限、W^X、Firewall切换、write/release与acquire/read/full-system barrier、data clean/invalidate零调用、clear policy、Host seal/TOCTOU、Measurement稳定地址和失败生命周期；FMC退出后128 KiB受控回收给GSP，Measurement固定16 KiB，MMP驻留DDR，SPDM等不单列物理Region；eHSM对整个2 MiB不做Firewall限制，但软件地址/长度/生命周期检查保留；PMA/Firewall、MMP DDR和release footprint Evidence关闭前不生成量产linker。
    - eHSM Mailbox wire/packet/note机制follow Vendor，平台参数收敛到NGU800P port。安全软件只上报错误和阻断release，任何reset/watchdog/隔离执行均通过RAS策略，不得在业务层复用Vendor reset magic。
    - 当前交付已经由SRC-0035实际elaboration路径明确的eHSM/Core模块数量、状态位、寄存器实现、reset/default和内部连接，应作为VENDOR_IMPLEMENTATION基线写入设计；接口意图对照Vendor手册，软件行为对照锁定版本FSP。不得把已回答内容保留为普通open question；只把elaboration缺口、SoC绑定、项目策略、资料冲突、动态验证或资料缺失项提交负责人裁决。
    - SoC地址、寄存器和IRQ硬件常量先从SRC-0022引用文件、宏/字段、System Address空间和生成版本；不得用GSP镜像、Vendor示例或聊天裸数值覆盖。C908产品接口不建立Local/System domain字段或转换；地址表没有说明的Owner、wrapper、时序和清除语义仍须保留为open question或冲突，不能从名称外推。
    - eHSM Host公共实现按ADR-0010保持Vendor direct布局和源码不变；项目不得在Vendor交付目录内打补丁或维护fork，只在批准port/custom/build/adapter边界适配。若当前RTL或port边界无法满足，升级集成冲突，不通过改Vendor公共代码规避。
    - eHSM driver mode按stage冻结：BootROM/FMC/GSP首版全程poll；Vendor FW ready后的interrupt仅为后续独立优化，必须经新设计变更并重新通过IRQ/callback/锁/context/pending状态门禁，不得由首版业务代码自行切换。RAS未ready时采用静态错误记录、有限上报等待和关闭普通中断后的无限WFI fail-stop循环。
    - BootROM设计必须逐项覆盖SRC-0023 secureboot.001～007、SRC-0034和ADR-0034：从不可变reset vector进入后首先以硬件readback证明FMC reset/clock/NX与Measurement写Owner，先失效Header、再清零并回读整个Measurement Region；读取一次只读non_sec_boot快照，值1强制NON_SECURE_BOOT/RESTRICTED_NONSECURE，值0才读取LCS/按需读取Strap，输入异常进入终态；值0、DEV/MANU、secure_boot=0且制造Profile有效选择MANUFACTURING_PROVISIONING，其他非安全原因选择RESTRICTED_NONSECURE，两个子Profile镜像/权限/release独立且禁止fallback。模式判定、eHSM ready、raw自检状态、FMC真实验签/强制解密、16字节rollback、Header Overlay/typed-stage policy、真实Measurement、受控load/一次性release和失败闭锁均须成为显式状态。BootROM不得获得raw eFuse或Key安装能力；未绑定时BLOCKED_BY_NON_SEC_BOOT_BINDING。值0时secure_boot合同固定为boot_pin.secure_boot[3]、default 0、0非安全/1安全且USER强制安全；当前SRC-0022 bit0/bit3不得直接绑定。LCS失败/非法/UNDEFINED/来源无法证明或策略组合未批准进入RESTRICTED_NONSECURE且不创建Measurement Entry/SoC State或启动审计。eHSM依据自身eFuse自主判断并执行或跳过自检，BootROM不得发送start-self-test命令，只读取ready/error/raw结果。
    - Secure Package设计只保留Vendor native Header和Code Region；type 1包使用offset1008/1016/1020 Overlay，type 0 Vendor FW不适用。Preflight必须校验Header CRC和末尾reserved；eHSM PASS前Overlay只能用于拒绝和精确限制目标副作用，PASS后必须从稳定输出重新取得Code_Size、Version_Counter、load_addr、CRC和reserved并与typed-stage固定目标精确匹配。身份/Profile/policy来自受信registry/matrix；旧Manifest和旧8字节零reserved包拒绝。
    - Verify/loader/release必须使用显式状态机：preflight失败表示未提交，Vendor确定失败保留raw code，timeout等acceptance unknown进入quarantine；任何Vendor PASS都不得绕过稳定Header/Overlay/typed-stage policy、loader以target加1024和Code_Size执行源摘要/copy/目标回读摘要比较、counter/Measurement门禁直接release。
    - Lifecycle/Debug/Key/Certificate必须遵守主详设第10章和ADR-0026/0034：BootROM不写LCS；GSP按精确相邻转换图发起typed请求；进入DEBUG前删除FW用户Key；Debug challenge/token不携带scope，只控制一个SoC全局开关并在timeout/reset/LCS变化时关闭；Vendor user-auth只消费一次。SoC Key轮换按云天定制需求写新Key并证明、切HSM Bitmap、destroy旧Key、reset生效，当前实现BLOCKED_BY_VENDOR_DELIVERY。制造使用DEV/MANU非安全制造子Profile、独立Provisioning FW、canonical CBOR/COSE signed recipe和eHSM BL typed object/operation；BL不信任C908并验证硬件制造条件/LCS/ticket/device/映射/顺序，禁止raw OTP/eHSM/caller自选slot。半写对象只按BL/backend明确合同恢复；最终Key/证书/策略通过产品安全启动预演后，MANU→USER最后提交。non_sec_boot=1和USER+pin均不重开制造；USER事后逃生声明需要独立强授权维修入口。Cert0/Cert1采用已批准的commit-last无active-pointer布局且不复用OTP Bitmap。
    - 证书PKI复杂性必须放在Provisioning Host、KMS和离线CA。Device只允许在DEV制造路径生成slot14不可导出Device Issuer私钥、导出公钥、签固定宽度fresh-nonce PoP、验证signed install ticket与本地device/Profile/Key/Root/hash，并将Host生成和验链的Root→Intermediate→Device Attestation Issuer静态前缀原子保存到Cert0/1；Device不得构造PKCS#10、不得解析通用X.509链、不得执行当前时间/CRL/OCSP策略、不得提供任意消息或任意digest签名接口。运行期仅GSP按批准的固定Profile组装一级Firmware Alias Leaf，eHSM负责UDS/CDI/alias key的不可导出派生及签名；完整链验证、时间/吊销策略和量产验收仍由Host/CA/Requester负责。
    - 首版Device Attestation采用Root→Intermediate→Device Attestation Issuer静态前缀加GSP当前安全启动生成的一级动态Firmware Alias Leaf，并使用SPDM 1.2证书KEY_EXCHANGE→FINISH secure session，不支持PSK；wire/profile为DESIGN_BLOCKED_BY_PROFILE_INPUT，未冻结前不得以stub、伪成功、非会话或静默降级代替。软件必须支持eHSM内部的SM2和P-256两套能力并分别完成Issuer签Leaf、Alias签Report/transcript和公钥匹配；每设备Profile二选一，slot14只持久化一把Issuer私钥，Cert0/Cert1只服务于该Profile，同机不同时使用两套长期身份。
    - 正常更新只写inactive slot并读回，SoC stage固定type 1且预验证固定check_version=0，type 2/3拒绝；metadata固定A/B双副本、单调sequence、integrity和commit-last。运行中的eHSM FW不得复用BL type 0命令，只存inactive并在reset后由BL最终验证。OOB MCU只验证外层请求并写固定FMC候选分区。任何Recovery不得回退到较低rollback counter或未验证镜像。
    - Multi-Die由Die0作为安全根完成Die1验签、解密、受控UCIe传输、目的digest、独立Measurement、Firewall最终化和release；Die1失败只隔离该实例及依赖者，不得降低Die0策略。
    - 产品/EMU构建禁止stub、simulated success、test key/cert、raw Vendor/OTP passthrough和silent fallback。测试按L0～L4及Source→Requirement/ADR→Design→Code→Case→Evidence闭环，环境缺能力标记BLOCKED_BY_ENV而不是PASS。
    - Release工具不得手工填零签名、公钥、IV或把明文Code标为ciphertext；必须输出package hash、最终Code hash、原始bin hash/length、padding length、Header/Overlay摘要、工具版本、key ID/证书标识和release metadata，不得输出私钥或敏感明文。
  tasks:
    - 每项任务记录 Task ID、目标仓库、当前分支、只读基线 commit、输入资料、修改范围、禁止修改范围、步骤、验证命令、输出、停止条件和回退方式。
    - 任务依赖 ../fsp 时，还必须记录 FSP remote、branch、commit 和工作区状态；FSP 更新后不得沿用未重新核对的函数行号、case 组合、Expected 或 Evidence。
    - 任务依赖eHSM内部硬件时，必须记录SRC-0035状态和tree hash、相对路径/module/instance/line、顶层/filelist/define/parameter/generate/wrapper条件及验证层级；哈希变化或elaboration输入不足时停止确定性结论。
    - 允许在默认分支工作区直接修改，不创建功能分支；不得执行 git add、git commit、git push、merge、rebase 或 tag。
    - 不得覆盖、清理或混入无关工作区修改；无法隔离时停止并报告。
    - 完成标准使用未提交 diff、实际修改文件、构建/测试结果、Evidence、追踪更新和剩余风险，不要求 commit、MR/PR 或合并。
    - Vendor 代码更新任务按交付快照和 delivery/release note 管理，不创建逐文件 Source Card；新交付登记新 Source ID 并关联旧版本。
    - 任务发现冲突时必须记录可继续范围和停止范围；受影响实现等待用户裁决，不得自行选择某一 Source 覆盖另一 Source。
    - 更新测试用例时保留原始 Source 快照，生成新的版本化工作簿并高亮变更；不得覆盖旧版本或把未执行用例标为已通过。
    - 代码实现任务不得以沿用现有 stub/test 流程为验收目标；EMU/产品路径不得引入 stub、模拟成功或其他可能遗留最终落地风险的编码方式，未完成能力必须 fail-close。
    - 所有项目级任务计划、OpenSpec 任务、开发追溯和测试规划都在 security_-scheme 创建和维护，不在 gsp-pmp-rmp-omp 或 baremetal 新增第二份主计划；代码仓已有历史文档不因本规则自动迁移或删除。
    - 每项任务必须明确目标是 security_-scheme、gsp-pmp-rmp-omp 还是 baremetal。正式详设、任务和测试工作簿在 security_-scheme 落实；产品安全软件实现放在 gsp-pmp-rmp-omp；eHSM 全能力可执行测试、runner/tools 由独立 baremetal 软件栈在 baremetal 仓库落实并运行于安全核；不得跨仓库混放或把 baremetal 能力验证写成 GSP 固件职责。
    - DD-02A baremetal全功能测试与DD-02B gsp产品移植必须使用两个独立实施任务；不得用一次跨仓任务同时修改两边，也不得让Vendor Demo顶层调用关系反向定义产品任务串联。
    - 详设依赖代码现状时，先建立小粒度INV-SEC调查任务，在只读、无Git操作、无代码修改条件下形成CE-SEC代码证据；报告必须包含路径、符号、调用链、构建条件、错误路径、限制以及代码事实/目标设计/差异分类。
  apply:
    - 实施前重新读取 AGENTS.md、批准的 OpenSpec change、相关 Source Card/ADR 和目标软件仓库的 AGENTS.md。
