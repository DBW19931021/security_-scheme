    - 运行任务规定的构建、测试和静态检查；不得绕过失败验证宣布完成。
    - 在 RESULT 中记录当前分支和只读基线 commit、实际修改文件、未提交 diff 摘要、命令、结果、Evidence、偏差和剩余风险。
    - 处理历史 review 候选项时，先更新 `sources/historical-review-index.yaml` 的复核状态；可复现缺陷进入 `issues/`，设计变化再通过批准的 OpenSpec change 实施。
