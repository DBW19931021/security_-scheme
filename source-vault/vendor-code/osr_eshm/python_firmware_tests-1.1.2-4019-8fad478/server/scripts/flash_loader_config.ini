# Flash Loader Configuration File
# This file contains configuration settings for the flash loader scripts

[OpenOCD]
# Path to OpenOCD executable
# Windows default path
windows_path = C:\Program Files\wing-openocd-windows\openocd-0.12.0\bin\openocd.exe

# Linux default path (update as needed)
linux_path = /usr/bin/openocd

# macOS default path (update as needed)
macos_path = /usr/local/bin/openocd

[Default]
# Default target device (cm3 or m130)
target = m130

# Default connection mode (jtag or swd)
mode = jtag

# Default options
verify = false
reset = false

[JLink]
# J-Link adapter speed in kHz
speed = 500

# J-Link interface settings
# For JTAG mode
jtag_irlen = 5
jtag_ircapture = 0x1
jtag_irmask = 0x1f

# For SWD mode
swd_expected_id = 0x1ba01477