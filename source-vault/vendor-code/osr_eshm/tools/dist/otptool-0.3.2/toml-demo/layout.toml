# === OTP Key Slots (物理 slot 0-15, 每个 40 字节) ===
# 对应固件 g_otp_default_keyid_map (#else 默认配置)
# 共享 slot 说明:
#   slot 4: ehsm_fw_verify_key + ehsm_upg_verify_key
#   slot 5: ehsm_encrypt_key + ehsm_upg_encrypt_key
#   slot 10: soc_fw_verify_key + soc_upg_verify_key
#   slot 11: soc_encrypt_key + soc_upg_encrypt_key
# 轮换 slot: 6/7/12 为密钥轮换目标槽位，初始写入空值

