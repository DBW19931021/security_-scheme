schema: spec-driven

context: |
  文档语言规则：除非用户明确要求其他语言，所有新增或更新的项目文档、OpenSpec proposal/design/spec/tasks、分析报告、周报和沉淀材料默认使用简体中文。
  代码符号、命令、路径、API 名称、寄存器名、宏名、枚举名、协议字段名和英文缩写应保留英文原文，必要时用中文解释。
  CPU 资料准源规则：本交付包承载 eHSM 代码的处理器核为 M130；凡涉及 CPU core、CSR、异常/中断、CLIC、启动上下文、特权级、PMP、WMSIS、CPU porting 或核相关寄存器/时序/集成行为的说明，均以 `docs/CPU/` 下资料为准。若源码注释、历史文档或推断与 `docs/CPU/` 资料冲突，应标记为待确认并优先引用 `docs/CPU/`。

rules:
  proposal:
    - 使用简体中文撰写；保留代码路径、命令、API 和宏名的英文原文。
  design:
    - 使用简体中文撰写；架构图、表格和安全分析说明也使用中文。
  specs:
    - 使用简体中文撰写 requirement 和 scenario；SHALL/MUST 等规范性关键词可保留英文。
  tasks:
    - 使用简体中文描述任务；命令、路径和文件名保留英文原文。
  cpu_reference:
    - 涉及 CPU 核相关内容时，必须优先查阅并引用 `docs/CPU/` 下资料。
    - 不得仅凭源码推断覆盖 `docs/CPU/` 中关于 M130 core、CSR、异常/中断、CLIC、启动上下文、特权级、PMP、WMSIS 或 CPU porting 的约束。

# 项目上下文：
# - 该上下文会展示给后续生成 OpenSpec artifact 的 AI。
# - 如需补充技术栈、编码规范、领域知识或安全约束，可以继续追加到 context 中。
#
# Artifact 规则：
# - rules 下的约束会影响后续 proposal/design/spec/tasks 的生成。
# - 当前项目最重要的规则是：默认使用简体中文撰写文档。
