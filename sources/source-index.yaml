governance:
  decision: decisions/ADR-0001-solution-authority-and-vendor-boundary.md
  baseline_hierarchy: "SRC-0017 system/architecture baseline -> SRC-0016 software engineering baseline -> implementation/tests/evidence"
  vendor_scope: "OSR eHSM and its internal Core only; excludes NGU800P SoC"
  vendor_adoption_rule: "Vendor recommendations become project software方案 only after being adopted into the current effective chip security software plan"
  key_rotation_status: "strategy approved; final engineering details governed by the chip security software plan"
  otp_key_registry_authority: "SRC-0024 Table 34 and 16-slot Key table target security_-scheme; baremetal manifests are derived implementation/test records, not a second baseline"
  vendor_document_confidentiality: NOT_CONFIDENTIAL_FOR_THIS_PROJECT
  vendor_code_management: "one Source ID per delivery snapshot; no per-file Source Card; new delivery note creates a new superseding Source ID"
  vendor_code_working_reference: "TASK-SEC-BAREMETAL-EHSM-001 uses ../fsp as the current living eHSM code/demo reference; every task records remote/branch/commit/dirty state. SRC-0018 osr_eshm remains an immutable historical snapshot and is not the default current reference."
  ehsm_internal_rtl_authority: "ADR-0032 / SRC-0035: source-vault/vendor_rtl is the first query source and current implementation baseline for eHSM-internal RTL details. Conclusions are VENDOR_IMPLEMENTATION and require top/filelist/defines/parameters/elaboration proof; it does not define NGU800P SoC integration or product policy."
  baseline_control: docs/09-plans/BASELINE-CONTROL.md
  conflict_escalation: "mark affected conclusion CONFLICTING, stop affected scope, create conflict report, present evidence/options/recommendation for owner decision"
  security_ram_design: "ADR-0006/0008/0028: product System Address 0x1010_0500_0000 + 2 MiB; fixed GSP static 880 KiB, FMC reuse 128 KiB, Measurement 16 KiB, PMP/RMP 256 KiB each and Host ingress 512 KiB; no independent plaintext Region; MMP resides mainly in protected DDR; PMA/Firewall/MMP DDR/release link-map evidence remains open"
  dice_dynamic_attestation: "ADR-0029/SRC-0032: BootROM contributes FMC final-readback hash, FMC contributes GSP hash, GSP derives one DICE-style Alias Key from slot13 UDS and TCB, builds a dynamic Firmware Alias Leaf signed by slot14 Device Issuer, and uses Alias Key for Report/SPDM; no raw UDS/CDI/private export; exact eHSM/Profile bindings remain OPEN-DESIGN-023"
  native_header_load_address: "ADR-0030/0033, SRC-0033/0036 and CE-SEC-016: NGU Manifest removed; NGU800P type 1 package uses LE64 load_addr at Native Header offset 1008, LE32 header CRC32 at 1016 and zero reserved[4] at 1020; Code_Size is the single loaded/measured length; typed stage context replaces Manifest policy; legacy Manifest and zero-reserved-v1 packages are rejected"
  mailbox_reset_boundary: "ADR-0006: NGU800P Mailbox follows Vendor mechanism; security reports/blocks only, RAS decides and performs reset actions"
  soc_map_register_authority: "ADR-0009 / SRC-0022: current RTL-synchronized baremetal generated headers are authoritative for NGU800P SoC address/register/IRQ constants; this does not make baremetal tests/stubs or inferred interface semantics authoritative"
  vendor_direct_mailbox_mode_and_early_ras: "ADR-0010: keep Vendor direct 16x4KiB Mailbox/common sources unchanged; BootROM/FMC/GSP first release poll; interrupt only a later post-FW-ready optimization; early RAS-unready failure records then bounded report wait, disable ordinary interrupts, and enter an infinite WFI fail-stop loop exited only by approved Reset/NMI"
  ehsm_single_flight_cache_timeout: "ADR-0011: one aligned 256-byte Vendor context slot and one in-flight transaction per stage; GSP serialized service; active cache/timeout scope; first-release auto-retry zero; timeout acceptance unknown and service/slot quarantined"
  bootrom_lcs_counter_gsp_fw_redelivery: "ADR-0012: BootROM reads SoC LCS directly and compares but does not update counter; GSP package anchors the global security epoch and FMC is the sole updater; eHSM FW/PMP/RMP/MMP must match the committed epoch; failed images isolate for Host redelivery; atomic bundle activation is optional"
  vendor_version_counter_implementation: "ADR-0019 closes OPEN-CONFLICT-009: FMC is the sole updater and must call a new eHSM BL dedicated 16-byte rollback-counter update/readback API after full GSP verification and load; exact command/packing/LCS/status/readback/delivery binding remains a Vendor implementation DoR"
  gsp_operation_image_service_isolation: "ADR-0013: GSP image set is eHSM FW/PMP/RMP/MMP; signing/RNG/hash and security-plan-required eHSM services are mandatory; internal generic crypto is lower priority; eHSM is final LCS authorization point; completed single-runtime failure is locally isolated"
  product_secure_package_algorithm_profiles: "ADR-0017: Profile 1 SHA-256+RSA-2048-PSS+AES-128-CBC; Profile 2 SHA-256+ECDSA-P256+AES-128-CBC; Profile 3 SM3+SM2+SM4-CBC. Other Vendor algorithms are baremetal capability/regression inputs only; product package/policy/release rejects them. Device/image/key/board/LCS binding remains OPEN-DESIGN-011."
  measurement_fmc_epoch_contract: "ADR-0012/0019/0022 + measurement-table.md: BootROM commits the unique verified FMC entry before release; FMC reads that valid committed entry from the current-start stable table, requires FMC/GSP rollback-counter equality, then performs update/readback when needed, commits GSP measurement, and releases"
